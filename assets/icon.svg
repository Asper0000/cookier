    .fly { animation: fly .7s cubic-bezier(.2,.9,.3,1.3) both }
    .c1{animation-delay:.55s}.c2{animation-delay:.65s}.c3{animation-delay:.75s}
    .c4{animation-delay:.85s}.c5{animation-delay:.95s}.c6{animation-delay:1.05s}
    .b1{animation-delay:1s}.b2{animation-delay:1.1s}.b3{animation-delay:1.2s}
    .f1{animation-delay:1.15s}.f2{animation-delay:1.25s}.f3{animation-delay:1.35s}
    @keyframes pop { from { transform: scale(0) rotate(-90deg); opacity: 0 } to { transform: none; opacity: 1 } }
    @keyframes grow { from { transform: scale(0) } to { transform: scale(1) } }
    @keyframes fly { from { transform: translate(-45px,35px) scale(0); opacity: 0 } to { transform: none; opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

